<!-- form tags are utilized to collect information from users. -->

<h1>Registration</h1>
<form action="" method="">
    <!-- action = Where (Server) you want to send this data -->
    <!-- method = How to send the data to server (Get) and (Post) -->
    <input type="text" placeholder="Username">
    <br><br>
    <input type="password" placeholder="Password">
    <br> <br>
    Gender : <input type="radio"> Male <input type="radio"> Female
    <br> <br>
    Hobbies: <br>
    <input type="checkbox"> Dancing
    <br>
    <input type="checkbox"> Singing
    <br>
    <input type="checkbox"> Reading
    <br><br>
    Address:
    <br> 
    <Textarea></Textarea>
    <br><br>
    City :
    <select name="" id="">
        <option value="">Rajkot</option>
        <option value="">Surat</option>
        <option value="">Ahmedabad</option>
    </select>
    <br><br>
    <input type="submit">
</form>
